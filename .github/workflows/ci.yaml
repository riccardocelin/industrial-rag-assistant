name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build/push for all images"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}

    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'app/api/**'
              - 'app/rag/**'
              - 'app/core/**'
              - 'docker/api.Dockerfile'
              - 'requirements-api.txt'
              - 'pytest.ini'
              - 'tests/**'
            ui:
              - 'app/ginterface/**'
              - 'app/core/**'
              - 'docker/ui.Dockerfile'
              - 'requirements-ui.txt'
              - 'pytest.ini'
              - 'tests/**'

  unit-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'  || github.event.inputs.force_build == 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -m unit

  build-api:
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: needs.changes.outputs.api == 'true' || github.event.inputs.force_build == 'true'

    env:
      IMAGE_API: ghcr.io/${{ github.repository }}/rag-api

    steps:
      - uses: actions/checkout@v6

      - name: Build API image
        run: |
          docker build \
            -f docker/api.Dockerfile \
            -t $IMAGE_API:${{ github.sha }} \
            -t $IMAGE_API:latest \
            .

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event.inputs.force_build == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event.inputs.force_build == 'true'
        run: |
          docker push $IMAGE_API:${{ github.sha }}
          docker push $IMAGE_API:latest

  build-ui:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.event.inputs.force_build == 'true'

    env:
      IMAGE_UI: ghcr.io/${{ github.repository }}/rag-ui

    steps:
      - uses: actions/checkout@v6

      - name: Build UI image
        run: |
          docker build \
            -f docker/ui.Dockerfile \
            -t $IMAGE_UI:${{ github.sha }} \
            -t $IMAGE_UI:latest \
            .

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event.inputs.force_build == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push UI image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event.inputs.force_build == 'true'
        run: |
          docker push $IMAGE_UI:${{ github.sha }}
          docker push $IMAGE_UI:latest